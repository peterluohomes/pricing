<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Erosion Waterfall – Peter Luo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Lato', sans-serif;
  background: #fff;
  display: flex; flex-direction: column; align-items: center;
  padding: 40px 24px 36px; min-height: 100vh;
}
.page-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 3vw, 30px);
  color: #1a2f5e; text-align: center; margin-bottom: 6px;
}
.page-sub {
  font-size: 13px; color: #888; text-align: center; margin-bottom: 6px;
}
.page-src {
  font-size: 11.5px; color: #aaa; text-align: center; margin-bottom: 26px;
}
.chart-wrap {
  width: 100%; max-width: 820px;
  background: #fff; border-radius: 12px;
  box-shadow: 0 4px 24px rgba(26,47,94,.10);
  padding: 28px 24px 20px;
}
.legend-row {
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: center; margin-top: 18px;
}
.legend-row + .legend-row { margin-top: 8px; }
.legend-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
.legend-dot  { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
.legend-line { width: 26px; height: 0; border-top: 3px solid #1a2f5e; flex-shrink: 0; }
.legend-line.median { border-top: 3px dashed #e87722; }
.insight-box {
  width: 100%;
  max-width: 820px;
  margin-top: 20px;
  background: #f0f4ff;
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 13px;
  color: #1a2f5e;
  line-height: 1.7;
}
.insight-box strong.title { display: block; font-size: 14px; margin-bottom: 4px; }
.insight-box strong { font-size: 13px; font-weight: 700; }
.branding {
  margin-top: 28px; font-size: 11px; color: #aaa;
  letter-spacing: 1px; text-transform: uppercase;
  width: 100%; line-height: 1.8;
}
.branding div { text-align: center; width: 100%; }
.branding span { color: #e87722; font-weight: 700; }
</style>
</head>
<body>

<div class="page-title">Price Erosion Waterfall</div>
<div class="page-sub">The cost of waiting: potential equity loss by market duration</div>
<div class="page-src" id="src"></div>

<div class="chart-wrap">
  <canvas id="waterfallChart"></canvas>
  <div class="legend-row">
    <div class="legend-pill"><div class="legend-dot" style="background:#2e7d32"></div>Asking Price</div>
    <div class="legend-pill"><div class="legend-dot" style="background:#f9e566"></div>0–14 Days</div>
    <div class="legend-pill"><div class="legend-dot" style="background:#f5b942"></div>15–30 Days</div>
    <div class="legend-pill"><div class="legend-dot" style="background:#f57c51"></div>31–60 Days</div>
    <div class="legend-pill"><div class="legend-dot" style="background:#e8392a"></div>61–90 Days</div>
    <div class="legend-pill"><div class="legend-dot" style="background:#9b2020"></div>91–120 Days</div>
    <div class="legend-pill"><div class="legend-dot" style="background:#555"></div>120+ Days</div>
  </div>
  <div class="legend-row">
    <div class="legend-pill"><div class="legend-line"></div>Average SP/LP</div>
    <div class="legend-pill"><div class="legend-line median"></div>Median SP/LP</div>
  </div>
</div>

<div class="insight-box" id="insight">
  <strong class="title">📊 Key Insight</strong>
  <span id="insightText"></span>
</div>

<div class="branding">
  <div><span>Peter Luo</span> &nbsp;·&nbsp; RE/MAX Realtron Realty Inc.</div>
  <div>&nbsp;·&nbsp; Pinnacle Listing System</div>
</div>

<!-- The numbers come from waterfall.json in this folder (made by waterfall_dom.py).
     The copy below is used only when waterfall.json can't be read (e.g. no internet at the
     appointment); waterfall_dom.py refreshes it whenever it runs. -->
<script type="application/json" id="wf-fallback">
{"type": "pinnacle-waterfall-summary", "version": 1, "generated": "2026-10-20T07:24:23", "place": "York", "homeTypes": ["Detached", "Semi-Detached", "Townhouse"], "soldSince": "2025-01-01", "gapDays": 90, "salesUsed": 14706, "buckets": [{"label": "0-14 days", "from": 0, "to": 14, "sales": 3449, "averagePct": 103.2, "medianPct": 100.0}, {"label": "15-30 days", "from": 15, "to": 30, "sales": 2717, "averagePct": 99.7, "medianPct": 97.4}, {"label": "31-60 days", "from": 31, "to": 60, "sales": 2818, "averagePct": 95.8, "medianPct": 94.5}, {"label": "61-90 days", "from": 61, "to": 90, "sales": 1700, "averagePct": 92.7, "medianPct": 91.7}, {"label": "91-120 days", "from": 91, "to": 120, "sales": 1186, "averagePct": 91.3, "medianPct": 90.1}, {"label": "120+ days", "from": 121, "to": null, "sales": 2836, "averagePct": 85.6, "medianPct": 85.5}]}
</script>

<script>
const COLORS = ['#2e7d32','#f9e566','#f5b942','#f57c51','#e8392a','#9b2020','#555555'];
const AVG = '#1a2f5e', MED = '#e87722';
let chart = null;

function fmt(v) { return v == null ? '—' : (Math.round(v * 10) / 10).toFixed(1) + '%'; }
function dateOf(s) {
  const d = new Date(s);
  return isNaN(d) ? '' : d.toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: 'numeric' });
}
function bucketLabel(b) {
  return b.to == null ? [b.from - 1 + '+', 'Days'] : [b.from + '–' + b.to, 'Days'];
}

// value labels: average above the bar, median under it
const valueLabels = {
  id: 'valueLabels',
  afterDatasetsDraw(c) {
    const cx = c.ctx, y = c.scales.y, bars = c.getDatasetMeta(0).data;
    const avg = c.data.datasets[1].data, med = c.data.datasets[2].data;
    cx.save(); cx.textAlign = 'center';
    bars.forEach((bar, i) => {
      const top = y.getPixelForValue(Math.max(avg[i] ?? 0, med[i] ?? 0));
      if (i === 0) {
        cx.font = 'bold 12px Lato, sans-serif'; cx.fillStyle = '#222';
        cx.fillText('100%', bar.x, top - 12);
        return;
      }
      cx.font = 'bold 12px Lato, sans-serif'; cx.fillStyle = AVG;
      cx.fillText(fmt(avg[i]), bar.x, top - 26);
      cx.font = 'bold 11px Lato, sans-serif'; cx.fillStyle = MED;
      cx.fillText(fmt(med[i]), bar.x, top - 12);
    });
    cx.restore();
  }
};

function render(d) {
  const bs = d.buckets || [];
  const labels = [['Asking', 'Price']].concat(bs.map(bucketLabel));
  const avg = [100].concat(bs.map(b => b.averagePct));
  const med = [100].concat(bs.map(b => b.medianPct));
  const n = [null].concat(bs.map(b => b.sales));

  const all = avg.concat(med).filter(v => v != null);
  const yMin = Math.floor((Math.min(...all) - 2) / 2) * 2;
  const yMax = Math.ceil((Math.max(...all) + 4) / 2) * 2;

  const types = (d.homeTypes || []).join(', ');
  document.getElementById('src').textContent =
    [d.place, types, d.salesUsed ? d.salesUsed.toLocaleString('en-CA') + ' sales since ' + dateOf(d.soldSince + 'T12:00') : '',
     d.generated ? 'updated ' + dateOf(d.generated) : ''].filter(Boolean).join(' · ');

  const first = bs[0], last = bs[bs.length - 1];
  if (first && last) {
    document.getElementById('insightText').innerHTML =
      'Overpricing doesn’t just delay your sale — it costs you equity. Homes sold in the first ' + first.to +
      ' days net <strong>' + fmt(first.averagePct) + ' of asking on average</strong> (median <strong>' + fmt(first.medianPct) +
      '</strong>). After ' + (last.from - 1) + ' days, that falls to <strong>' + fmt(last.averagePct) +
      '</strong> (median <strong>' + fmt(last.medianPct) + '</strong>). <em>Time on market is money out of your pocket.</em>';
  }

  const data = {
    labels,
    datasets: [
      { type: 'bar', label: 'Average SP/LP', data: avg, backgroundColor: COLORS.map(c => c + 'B3'),
        borderRadius: 5, borderSkipped: false, order: 3 },
      { type: 'line', label: 'Average SP/LP', data: avg, borderColor: AVG, borderWidth: 2.5,
        pointBackgroundColor: AVG, pointBorderColor: '#fff', pointBorderWidth: 1.5, pointRadius: 5,
        tension: 0, order: 1 },
      { type: 'line', label: 'Median SP/LP', data: med, borderColor: MED, borderWidth: 2.5, borderDash: [7, 5],
        pointBackgroundColor: MED, pointBorderColor: '#fff', pointBorderWidth: 1.5, pointRadius: 5,
        tension: 0, order: 2 }
    ]
  };
  const options = {
    responsive: true,
    animation: { duration: 900 },
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        filter: item => item.datasetIndex !== 0,
        callbacks: {
          title: items => items[0].label.replace(',', ' '),
          label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)} of asking price`,
          footer: items => n[items[0].dataIndex] ? n[items[0].dataIndex].toLocaleString('en-CA') + ' sales' : ''
        }
      }
    },
    scales: {
      y: {
        min: yMin, max: yMax,
        ticks: { callback: v => v + '%', stepSize: 2 },
        title: { display: true, text: 'Sold Price / Asking Price', font: { size: 12 } },
        grid: { color: '#f0f0f0' }
      },
      x: {
        title: { display: true, text: 'Days on Market', font: { size: 12 } },
        grid: { display: false }
      }
    }
  };
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('waterfallChart').getContext('2d'),
                    { type: 'bar', data, options, plugins: [valueLabels] });
}

function fallback() {
  try { return JSON.parse(document.getElementById('wf-fallback').textContent); } catch (e) { return null; }
}

(async function () {
  let d = null;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch('waterfall.json', { cache: 'no-store', signal: ctl.signal });
    clearTimeout(t);
    if (r.ok) { d = await r.json(); if (!d || !Array.isArray(d.buckets) || !d.buckets.length) d = null; }
  } catch (e) { d = null; }
  render(d || fallback());
})();
</script>
</body>
</html>
